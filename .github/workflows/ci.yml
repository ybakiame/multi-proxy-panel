name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Tauri Linux system dependencies
        # pp-client-tauri（workspace 成员）依赖 tauri → gtk / webkit2gtk → glib-sys，
        # 其 build script 用 pkg-config 探测系统库；裸 ubuntu-latest 未安装这些
        # dev 包时 clippy/test 在 build script 阶段即失败（glib-2.0 not found）。
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        # channel 与 rust-toolchain.toml 保持一致（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Verify panel
        run: bun run --filter pp-web verify
