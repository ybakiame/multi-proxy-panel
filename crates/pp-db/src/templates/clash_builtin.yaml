# Built-in Clash Meta / Mihomo template
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://223.5.5.5/dns-query
    - https://8.8.8.8/dns-query

proxies:
  <PROXY_REPLACE>

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      <NODE_REPLACE>
      - DIRECT
  - name: Domestic
    type: select
    proxies:
      - DIRECT
      - Proxy
  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  - GEOIP,CN,Domestic
  - GEOSITE,cn,Domestic
  - GEOSITE,category-ads-all,AdBlock
  - MATCH,Proxy
