<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProxyPanel Client</title>
    <script>
      // 主题预置（首帧前执行，避免闪变）：与 HeroUI v3 useTheme 的存储键/值域一致
      // （heroui-theme：light / dark / system，默认 system 跟随系统），React 挂载后
      // 由 useTheme 接管（App.tsx ThemeBootstrap）。
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("heroui-theme");
        } catch (e) {
          /* 存储不可用：按无记录处理 */
        }
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved = stored === "light" || stored === "dark" ? stored : systemDark ? "dark" : "light";
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
