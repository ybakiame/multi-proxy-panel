name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Build panel
        run: bun run --filter pp-web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/panel/dist
          retention-days: 1

  build:
    name: Build Binaries
    needs: [web]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools (aarch64)
        if: matrix.arch == 'aarch64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: |
          cargo build --release --locked -p pp-hub -p pp-agent -p pp-cli --target ${{ matrix.target }}

      - name: Strip binaries
        run: |
          strip target/${{ matrix.target }}/release/proxy-panel-hub || true
          strip target/${{ matrix.target }}/release/proxy-panel-agent || true
          strip target/${{ matrix.target }}/release/proxy-panel || true

      - name: Package agent tarball
        run: |
          mkdir -p dist
          tar -czf dist/proxy-panel-agent-linux-${{ matrix.arch }}.tar.gz \
            -C target/${{ matrix.target }}/release proxy-panel-agent

      - name: Package CLI tarball
        run: |
          mkdir -p dist
          tar -czf dist/proxy-panel-cli-linux-${{ matrix.arch }}.tar.gz \
            -C target/${{ matrix.target }}/release proxy-panel

      - name: Download web artifact
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist

      - name: Package hub tarball
        run: |
          mkdir -p hub-bundle
          cp target/${{ matrix.target }}/release/proxy-panel-hub hub-bundle/
          cp target/${{ matrix.target }}/release/proxy-panel hub-bundle/
          cp -r web/dist hub-bundle/
          tar -czf dist/proxy-panel-hub-linux-${{ matrix.arch }}.tar.gz -C hub-bundle .

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tarballs-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  desktop-windows:
    name: Build Desktop (Windows NSIS, ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            seed_arch: amd64
          - target: aarch64-pc-windows-msvc
            arch: aarch64
            seed_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # prost-build（pp-proto）在 Windows runner 上构建需要 protoc。
      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: ${{ matrix.target }}

      - name: Build desktop app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/client
          args: --target ${{ matrix.target }} --config src-tauri/tauri.windows.conf.json5
          # 不传 tagName：仅构建不创建 release，产物经 artifact 汇总给 release job 统一发布。
        env:
          # overlay 的 beforeBuildCommand 自动抓取种子核心（ADR-0008 D5）；交叉构建
          # （x64 宿主构建 arm64 包）须显式指定目标架构。
          SEED_ARCH: ${{ matrix.seed_arch }}
          # updater 签名密钥（ADR-0008 D2）；未配置 secret 时跳过签名，release job
          # 相应跳过 latest.json 生成（降级为无自动更新的普通发布）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-${{ matrix.arch }}
          # 安装包 + updater 更新包（.nsis.zip）与签名（.sig，密钥已配置时）。
          path: apps/client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
          retention-days: 1

  release:
    name: Create Release
    needs: [build, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all tarball artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: tarballs-*
          merge-multiple: true

      - name: Download Windows desktop installers
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: desktop-windows-*
          merge-multiple: true

      - name: Generate updater manifest (latest.json, ADR-0008 D2)
        # 仅稳定版 tag：预发布（tag 含 -）不占用 releases/latest 端点，不进入自动更新。
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          VER="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          X64="ProxyPanel_${VER}_x64-setup.nsis.zip"
          ARM64="ProxyPanel_${VER}_arm64-setup.nsis.zip"
          # 文件名中的版本取自 tauri.conf.json：tag 与 conf 版本不一致即失败，避免
          # 发布出与 updater 版本比较错位的更新包。
          for f in "$X64" "$ARM64"; do
            [ -f "$f" ] || { echo "::error::缺少更新包 $f（tag 与 tauri.conf.json 版本不一致？）"; exit 1; }
          done
          if [ ! -f "$X64.sig" ] || [ ! -f "$ARM64.sig" ]; then
            echo "::warning::缺少 .sig（未配置 TAURI_SIGNING_PRIVATE_KEY？），跳过 latest.json；本次发布无自动更新"
            exit 0
          fi
          jq -n \
            --arg v "$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg sx "$(cat "$X64.sig")" --arg ux "$BASE/$X64" \
            --arg sa "$(cat "$ARM64.sig")" --arg ua "$BASE/$ARM64" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $sx, url: $ux},
              "windows-aarch64": {signature: $sa, url: $ua}
            }}' > latest.json
          cat latest.json

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.exe *.nsis.zip > SHA256SUMS
          [ -f latest.json ] && sha256sum latest.json >> SHA256SUMS || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Build and Push Docker Images
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta (hub)
        id: meta-hub
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/proxy-panel-hub
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Docker meta (agent)
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/proxy-panel-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hub
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
