name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Tauri Linux system dependencies
        # pp-client-tauri（workspace 成员）依赖 tauri → gtk / webkit2gtk → glib-sys，
        # 其 build script 用 pkg-config 探测系统库；裸 ubuntu-latest 未安装这些
        # dev 包时 clippy/test 在 build script 阶段即失败（glib-2.0 not found）。
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        # channel 与 rust-toolchain.toml 保持一致（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  client-shells:
    name: Client Shells (desktop / mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri Linux system dependencies
        # 双壳（desktop/mobile src-tauri）依赖 tauri → gtk / webkit2gtk → glib-sys，
        # 与根 workspace 的 pp-client-tauri 相同，需要系统 dev 包。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 双壳是独立 cargo 项目（不在根 workspace），rust 任务的 clippy/test 覆盖不到；
      # 这里单独门禁，避免「根 workspace 全绿但壳编译失败」。
      - name: Check desktop shell
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check mobile shell (host)
        run: cargo clippy --manifest-path apps/mobile/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check mobile shell (aarch64-linux-android)
        # 覆盖 host 编译不可见的 #[cfg(target_os = "android")] 路径（历史上两次
        # 「host 全绿但 Android 编译失败」的盲区）。apps/mobile/src-tauri/.cargo/config.toml
        # 内的 NDK 路径是本机绝对路径，CI 上用 ubuntu-latest 预装 NDK 以环境变量覆盖
        # （环境变量优先级高于 .cargo/config.toml）。
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "Using NDK: $NDK"
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android33 --sysroot=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot -isystem $NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          cd apps/mobile/src-tauri && cargo check --target aarch64-linux-android

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Verify panel
        run: bun run --filter pp-web verify

      - name: Verify client-core (shared library)
        run: bun run --filter @pp/client-core verify

      - name: Verify desktop UI
        run: bun run --filter pp-client-ui verify

      - name: Verify mobile UI
        run: bun run --filter pp-client-mobile-ui verify
