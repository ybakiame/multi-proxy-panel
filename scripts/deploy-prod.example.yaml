# Example production inventory for scripts/deploy-prod.py
#
# SECURITY NOTES:
#   1. Do NOT commit this file with real secrets. Use environment variables
#      (e.g. ${JWT_SECRET}) and keep them in a password manager / vault.
#   2. Prefer SSH key authentication. Use ssh_password only as a fallback and
#      remove it from this file after the first deploy.
#   3. For strict host-key verification (default), make sure the target hosts
#      are already in your ~/.ssh/known_hosts file.
#
# Usage:
#   # 1. (Recommended for production) Pre-generate remote agent tokens and node ids.
#      #    You can skip this for the Hub's local agent - deploy-prod.py will
#      #    provision it automatically and print/save the generated secrets.
#      export TEST2_AGENT_TOKEN="$(./target/release/proxy-panel gen-token)"
#      export TEST2_AGENT_ID="$(\
#        ./target/release/proxy-panel provision-node \
#          --database-url 'sqlite:///opt/proxy-panel/data/proxypanel.db?mode=rwc' \
#          --name test2 \
#          --hostname test2-panel.ybakiame.net \
#          --address 192.3.150.233 \
#          --token "$TEST2_AGENT_TOKEN" \
#          | awk -F': ' '/^node_id:/ {print $2}')"
#
#   # 2. Deploy. JWT_SECRET and ADMIN_PASSWORD are auto-generated if not set.
#      python3 scripts/deploy-prod.py --inventory deploy-prod.example.yaml --action deploy
#
#   # 3. (Optional) Save auto-generated secrets to a file for your records:
#      python3 scripts/deploy-prod.py --inventory deploy-prod.example.yaml \
#        --action deploy --secrets-out .deploy-secrets.env
#
#   # 4. Subsequent updates only replace binaries/frontend and run migrations:
#      python3 scripts/deploy-prod.py --inventory deploy-prod.example.yaml --action update
#
# Why pre-generate tokens?
#   - Agents can be deployed independently from the Hub (no need to SSH into
#     the Hub during agent deployment just to provision a token).
#   - Tokens can be stored in a password manager / vault before deployment.
#   - The inventory file never needs to call back to the Hub to fetch secrets.
#
# deploy-prod.py can also provision remote agents automatically after the Hub is
# deployed. If agent.token and agent.agent_id are omitted, the script will SSH
# into the corresponding Hub, run provision-node, and use the returned credentials.
# In that case you only need to provide agent.hub_url (and optional agent.hub if
# the hub domain is not in the same inventory).

# ---------------------------------------------------------------------------
# Hub-specific defaults. Values here can be overridden per-server.
# ---------------------------------------------------------------------------
hub:
  listen: "127.0.0.1:8081"
  grpc_listen: "0.0.0.0:50052"
  db_url: "sqlite:///opt/proxy-panel/data/proxypanel.db?mode=rwc"
  auto_register_agents: false
  install_caddy: true
  admin_username: admin
  # admin_password: ${ADMIN_PASSWORD}   # optional: auto-generated if omitted
  # jwt_secret: ${JWT_SECRET}           # optional: auto-generated if omitted

# ---------------------------------------------------------------------------
# Server list. mode must be "hub" or "agent".
# SSH credentials are defined per-server so each host can use its own key.
# ---------------------------------------------------------------------------
servers:
  - name: test3
    host: 64.188.27.110
    mode: hub
    user: root
    port: 22
    ssh_key: ~/.ssh/id_rsa
    # ssh_password: ${TEST3_SSH_PASSWORD:-}
    host_key_policy: strict
    domain: test3-panel.ybakiame.net
    # jwt_secret and admin_password are optional; omit them to let the script
    # auto-generate and print/save them on first deploy.
    # jwt_secret: ${JWT_SECRET}
    # admin_password: ${ADMIN_PASSWORD}
    # If you want to use a pre-provisioned local agent (runs on the same host as
    # the Hub), its hub_url MUST point to the loopback address, e.g.
    # "http://127.0.0.1:50052". Do NOT use the public domain here - that would
    # route local agent traffic over the public network unnecessarily.
    # If the agent block is omitted, the deploy script will provision the local
    # agent automatically and use 127.0.0.1 for you.
    #
    # Recommended workflow for local agent: omit this block on first deploy,
    # then read the auto-generated token from the deployment summary and store
    # it in your vault. On subsequent deploys you can pin it here.
    # agent:
    #   hub_url: "http://127.0.0.1:50052"
    #   token: ${TEST3_AGENT_TOKEN}
    #   agent_id: ${TEST3_AGENT_ID}

  - name: test2
    host: 192.3.150.233
    mode: agent
    user: root
    port: 22
    ssh_key: ~/.ssh/id_rsa_test2
    # ssh_password: ${TEST2_SSH_PASSWORD:-}
    host_key_policy: strict
    # domain is used when generating subscriptions. If omitted, the agent's IP
    # address (host) is used instead. The domain is reported by the Agent during
    # registration and stored on the Node record in the Hub database.
    domain: test2-panel.ybakiame.net
    agent:
      # Remote agents connect to the Hub's public gRPC endpoint.
      # The script will auto-provision this agent on the Hub if token/agent_id
      # are omitted. To pin credentials, pre-generate them with:
      #   proxy-panel provision-node --name test2 --token "$TEST2_AGENT_TOKEN"
      # and uncomment the two lines below.
      hub: test3
      hub_url: "https://test3-panel.ybakiame.net:443"
      # token: ${TEST2_AGENT_TOKEN}
      # agent_id: ${TEST2_AGENT_ID}
      # tls_domain is the domain the Agent should verify on the Hub's TLS
      # certificate. It is independent from the agent's own domain above.
      tls_domain: "test3-panel.ybakiame.net"
