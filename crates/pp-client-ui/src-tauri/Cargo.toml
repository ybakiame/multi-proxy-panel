[package]
name = "pp-client-ui"
version = "0.1.0"
edition = "2021"
description = "ProxyPanel 桌面客户端壳（Tauri 2 命令层）"
license = "AGPL-3.0-or-later"
authors = ["ProxyPanel Contributors"]
repository = "https://github.com/your-org/proxy-panel"
rust-version = "1.86"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
pp-client = { path = "../../pp-client" }
pp-common = { path = "../../pp-common" }
pp-mitm = { path = "../../pp-mitm" }
pp-script = { path = "../../pp-script" }

# 退出根 workspace，作为独立 cargo 项目构建（避免与根 workspace 冲突）。
[workspace]
