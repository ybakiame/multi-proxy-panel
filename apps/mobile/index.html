<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProxyPanel Mobile</title>
    <script>
      // 主题预置（首帧前执行，避免 React 挂载前的闪变）：与 theme.tsx 的
      // 存储键/值域一致（pp-ui-theme：light / dark / system；存量历史键
      // heroui-theme 回退读取）。无记录时跟随系统深浅色（system 为默认值）；
      // Konsta 暗色变体依赖 .dark 类（见 konsta/styles/base.css）。
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("pp-ui-theme") || localStorage.getItem("heroui-theme");
        } catch (e) {
          /* 存储不可用（如 WebView 私密模式）：按无记录处理 */
        }
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved = stored === "light" || stored === "dark" ? stored : systemDark ? "dark" : "light";
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
  </head>
  <body class="bg-white text-zinc-900 antialiased dark:bg-black dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
