syntax = "proto3";

package v2ray.core.app.stats.command;

// V2Ray StatsService API as implemented by sing-box's experimental.v2ray_api.
// sing-box registers the service under this gRPC path
// ("/v2ray.core.app.stats.command.StatsService/<method>") and supports the
// `patterns`/`regexp` superset fields; message field numbers stay compatible
// with v2ray-core.
service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}

message GetStatsRequest {
  string name = 1;
  bool reset = 2;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message GetStatsResponse {
  Stat stat = 1;
}

message QueryStatsRequest {
  // Deprecated by sing-box, kept for wire compatibility with v2ray-core.
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}
