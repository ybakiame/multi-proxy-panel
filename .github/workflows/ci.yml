name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/check-rust-gates.sh'
              - 'flake.nix'
              - 'flake.lock'
              - 'devenv.nix'
              - 'nix/**'
              - '.github/workflows/ci.yml'
            panel:
              - 'apps/panel/**'
              - 'package.json'
              - 'bun.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'devenv.nix'
              - 'nix/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: nix develop --no-pure-eval --command bash --noprofile --norc -c 'cargo fmt --all --check'
      - name: Run Clippy
        run: nix develop --no-pure-eval --command bash --noprofile --norc -c 'cargo clippy --workspace --all-targets -- -D warnings'
      - name: Run tests
        run: nix develop --no-pure-eval --command bash --noprofile --norc -c 'cargo test --workspace'

  web:
    name: Web Checks
    needs: changes
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: nix develop --no-pure-eval --command bash --noprofile --norc -c 'bun install --frozen-lockfile'
      - name: Verify panel
        run: nix develop --no-pure-eval --command bash --noprofile --norc -c 'bun run --filter pp-web verify'
