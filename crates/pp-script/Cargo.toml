[package]
name = "pp-script"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
pp-common = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
sha2 = { workspace = true }
# rquickjs 对 android 无预生成 bindings：Android target 需 `bindgen` feature
# （构建时用 libclang 生成）。桌面平台继续用预生成 bindings，避免引入 bindgen
# 构建期依赖。rquickjs 的两个 target 声明各管各平台，feature 不会跨 target 合并。
[target.'cfg(not(target_os = "android"))'.dependencies]
rquickjs = { version = "0.12", features = [
    "futures",
    "macro",
    "rust-alloc",
] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", features = [
    "futures",
    "macro",
    "rust-alloc",
    "bindgen",
] }

[dev-dependencies]
tempfile = "3"
