name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NIX_CONFIG: |
    substituters = https://cache.nixos.org https://devenv.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/check-rust-gates.sh'
              - 'devenv.yaml'
              - 'devenv.lock'
              - 'devenv.nix'
              - 'nix/**'
              - '.github/workflows/ci.yml'
            panel:
              - 'apps/panel/**'
              - 'package.json'
              - 'bun.lock'
              - 'devenv.yaml'
              - 'devenv.lock'
              - 'devenv.nix'
              - 'nix/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: devenv shell -- cargo fmt --all --check
      - name: Run Clippy
        run: devenv shell -- cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: devenv shell -- cargo test --workspace

  web:
    name: Web Checks
    needs: changes
    if: needs.changes.outputs.panel == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: Verify panel
        run: devenv shell -- bun run --filter pp-web verify
