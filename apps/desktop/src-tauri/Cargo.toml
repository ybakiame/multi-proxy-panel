[package]
name = "pp-client-ui"
version = "0.1.0"
edition = "2021"
description = "ProxyPanel 桌面客户端壳（Tauri 2 命令层）"
license = "AGPL-3.0-or-later"
authors = ["ProxyPanel Contributors"]
repository = "https://github.com/ybakiame/multi-proxy-panel"
rust-version = "1.86"

# lib 供 `src/main.rs` 的 bin target 调用 `run()`。
[lib]
name = "pp_client_ui_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
pp-client = { path = "../../../crates/pp-client" }
pp-client-tauri = { path = "../../../crates/pp-client-tauri" }
pp-common = { path = "../../../crates/pp-common" }
pp-mitm = { path = "../../../crates/pp-mitm" }
pp-script = { path = "../../../crates/pp-script" }

# 退出根 workspace，作为独立 cargo 项目构建（避免与根 workspace 冲突）。
[workspace]
