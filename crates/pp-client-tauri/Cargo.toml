[package]
name = "pp-client-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "双端通用 Tauri 命令层（Desktop/Mobile 壳共享）"

[features]
# 桌面（mitm）全功能开关：desktop 壳显式开启；mobile 壳不开 → pp-client 以
# scripts-only 形态进入 mobile 构建图（无 pp-mitm）。
mitm = ["pp-client/mitm"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
chrono = { workspace = true }
pp-client = { workspace = true }
pp-common = { workspace = true }
pp-script = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
