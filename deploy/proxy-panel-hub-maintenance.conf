# ProxyPanel Hub maintenance drop-in (optional, admin-installed).
#
# Install (admin action, NOT automatic):
#   sudo install -o root -g root -m 0644 deploy/proxy-panel-hub-maintenance.conf \
#     /etc/systemd/system/proxy-panel-hub.service.d/10-maintenance.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart proxy-panel-hub
#
# The base unit (deploy/proxy-panel-hub.service) sets NoNewPrivileges=true, which
# blocks the Hub from escalating via sudo. This drop-in relaxes ONLY that knob so the
# in-panel update center can invoke the restricted sudoers rule; all other hardening
# is unchanged. Do not add other overrides here without an ADR.
[Service]
NoNewPrivileges=false
