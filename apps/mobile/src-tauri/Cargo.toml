[package]
name = "pp-client-mobile-ui"
version = "0.1.0"
edition = "2021"
description = "ProxyPanel 移动客户端壳（Tauri 2，Android 目标，命令层来自 pp-client-tauri）"
license = "AGPL-3.0-or-later"
authors = ["ProxyPanel Contributors"]
repository = "https://github.com/ybakiame/multi-proxy-panel"
rust-version = "1.86"

# Tauri 2 移动端（Android/iOS）构建要求 crate 提供 lib target：
# gradle 侧的 tauri rust 插件以 `cargo build --lib` 产出共享库并由
# `tauri::mobile_entry_point` 注入 JNI 入口；桌面端由 main 调用 `run()`。
[lib]
name = "pp_client_mobile_ui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
pp-client-tauri = { path = "../../../crates/pp-client-tauri" }
tracing = "0.1"

# ADR-0003 收益：移动壳依赖表不直接列出 pp-client / pp-common / pp-mitm / pp-script
# （M3.5 清理：pp-client/pp-common 为壳骨架遗留冗余边，mobile 源码零直接引用，经
# pp-client-tauri 传递即可），也无需 desktop 壳的 feature-gating 注释。
# 注：pp-client-tauri 依赖的 crates/pp-client default features 当前仍含 mitm，
# pp-mitm 尚以传递依赖（经共享层边）进入构建图；待 pp-client 将 mitm 移出 default
# features 并完成模块解耦（后续独立任务，原 M4 范围）后彻底移除。

# 退出根 workspace，作为独立 cargo 项目构建（避免与根 workspace 冲突）。
[workspace]

# Android release 体积优化：strip 符号 + LTO + 单 codegen unit + size 优化。
# 移动端 APK 中 lib/*.so 占 96%+ 体积，此配置对四 ABI 平均可再压缩约 30-40%。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
