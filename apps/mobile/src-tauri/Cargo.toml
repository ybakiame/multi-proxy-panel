[package]
name = "pp-client-mobile-ui"
version = "0.1.0"
edition = "2021"
description = "ProxyPanel 移动客户端壳（Tauri 2，Android 目标，命令层来自 pp-client-tauri）"
license = "AGPL-3.0-or-later"
authors = ["ProxyPanel Contributors"]
repository = "https://github.com/ybakiame/multi-proxy-panel"
rust-version = "1.86"

# Tauri 2 移动端（Android/iOS）构建要求 crate 提供 lib target：
# gradle 侧的 tauri rust 插件以 `cargo build --lib` 产出共享库并由
# `tauri::mobile_entry_point` 注入 JNI 入口；桌面端由 main 调用 `run()`。
[lib]
name = "pp_client_mobile_ui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
pp-client = { path = "../../../crates/pp-client" }
pp-client-tauri = { path = "../../../crates/pp-client-tauri" }
pp-common = { path = "../../../crates/pp-common" }
tracing = "0.1"

# ADR-0003 收益：移动壳依赖表不直接列出 pp-mitm / pp-script（Android 无 MITM；
# pp-script 经 pp-client-tauri 间接使用），也无需 desktop 壳的 feature-gating 注释。
# 注：crates/pp-client 的 default features 当前仍含 mitm，pp-mitm 尚以传递依赖进入
# 构建图；待共享层将 mitm 移出 default features（M4 范围）后彻底移除。

# 退出根 workspace，作为独立 cargo 项目构建（避免与根 workspace 冲突）。
[workspace]

# Android release 体积优化：strip 符号 + LTO + 单 codegen unit + size 优化。
# 移动端 APK 中 lib/*.so 占 96%+ 体积，此配置对四 ABI 平均可再压缩约 30-40%。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
