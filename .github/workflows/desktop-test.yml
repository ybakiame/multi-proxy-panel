name: Desktop Test Build

# 手动触发的桌面端测试构建：与 release.yml 的 desktop-windows job 同参数构建
# Windows NSIS 安装包，但只上传 artifact，不创建 Release、不推送任何发布产物。
# 用于发版前的手动验证 / 给测试人员分发构建包。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        type: choice
        default: both
        options:
          - both
          - x86_64
          - aarch64
      sign:
        description: '使用 updater 签名密钥（生成 .nsis.zip + .sig）'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute matrix from input
        id: plan
        run: |
          set -euo pipefail
          case "${{ inputs.arch }}" in
            x86_64)
              M='{"include":[{"target":"x86_64-pc-windows-msvc","arch":"x86_64","seed_arch":"amd64"}]}'
              ;;
            aarch64)
              M='{"include":[{"target":"aarch64-pc-windows-msvc","arch":"aarch64","seed_arch":"arm64"}]}'
              ;;
            *)
              M='{"include":[{"target":"x86_64-pc-windows-msvc","arch":"x86_64","seed_arch":"amd64"},{"target":"aarch64-pc-windows-msvc","arch":"aarch64","seed_arch":"arm64"}]}'
              ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    name: Build Desktop (Windows NSIS, ${{ matrix.arch }})
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # prost-build（pp-proto）在 Windows runner 上构建需要 protoc。
      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: ${{ matrix.target }}

      - name: Build desktop app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/client
          args: --target ${{ matrix.target }} --config src-tauri/tauri.windows.conf.json5
          # 不传 tagName：仅构建不创建 release，产物经 artifact 分发。
        env:
          # overlay 的 beforeBuildCommand 自动抓取种子核心（ADR-0008 D5）；交叉构建
          # （x64 宿主构建 arm64 包）须显式指定目标架构。
          SEED_ARCH: ${{ matrix.seed_arch }}
          # 仅在输入选择签名时注入 updater 签名密钥；测试构建默认不签名（无
          # .nsis.zip 更新包与 .sig），避免与正式发布的更新包混淆。
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: desktop-test-windows-${{ matrix.arch }}
          # 安装包 + updater 更新包（.nsis.zip）与签名（.sig，选择签名时）。
          path: apps/client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
          retention-days: 7
