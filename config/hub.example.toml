# Example Hub configuration.
# Copy this file to config/hub.toml and adjust values for your deployment.

listen = "0.0.0.0:8081"
grpc_listen = "0.0.0.0:50052"
database_url = "postgres://proxypanel:changeme@localhost/proxypanel"
static_dir = "apps/panel/dist"

# Comma-separated list of allowed CORS origins. Leave empty to allow same-origin only.
# In production, set this to the exact origin(s) serving the web panel.
cors_origins = "http://localhost:8080,https://panel.example.com"

# Comma-separated list of trusted proxy IPs. Only these IPs may provide X-Forwarded-For.
trusted_proxy_ips = "127.0.0.1,::1"

# Allow any agent with a valid token to auto-register as a new node.
# WARNING: enable only for development. Always disable in production.
auto_register_agents = true

# JWT secret for admin authentication — required, at least 32 characters.
# Generate a random value, e.g.: openssl rand -base64 42
jwt_secret = "change-me-to-a-random-secret"

# Optional GitHub-compatible Release API mirror/test endpoint (environment only):
# PROXYPANEL_RELEASE_API_BASE=https://api.github.com

# In-panel update center (Hub self-update). Disabled by default.
# When enabled, POST /api/v1/system/update triggers `sudo systemd-run --unit=proxy-panel-hub-update
# --collect <cli> upgrade hub ... --status-file <status_file>` as root. This requires the
# admin-installed authorization files deploy/proxy-panel-maintenance.sudoers and
# deploy/proxy-panel-hub-maintenance.conf — see docs/deployment.md "面板更新中心".
# maintenance_enabled = false
# maintenance_status_file = "data/hub-update.json"   # must match the sudoers --status-file argument
# maintenance_cli_path = "/usr/local/bin/proxy-panel"
# maintenance_sudo_path = "/usr/bin/sudo"
# maintenance_systemd_run_path = "/usr/bin/systemd-run"
